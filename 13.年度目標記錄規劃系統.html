      const highRate = highTotal > 0 ? Math.round(highProgressSum / highTotal) : 0;

      const setElText = (id, txt) => {
        const el = document.getElementById(id);
        if (el) el.innerText = txt;
      };

      setElText('stat-total', total);
      setElText('stat-excellent', `${rate}%`);
      setElText('stat-excellent-sub', `${excellentCount} 個項目進度良好 (跨全年度)`);
      setElText('stat-high-rate', `${highRate}%`);
      setElText('stat-high-sub', `共 ${highTotal} 個高權重核心項目`);
      setElText('stat-poor', poorCount);
      setElText('stat-paused', pausedCount);
    }

    function openAddYearModal() { 
      document.getElementById('new-year-input').value = '';
      openModal('add-year-modal'); 
    }

    function handleAddYear(e) {
      e.preventDefault();
      const val = document.getElementById('new-year-input').value.trim();
      if (val && /^[0-9]{4}$/.test(val) && !db.years[val]) {
        db.years[val] = { metaDate: `${val}年規劃`, items: [] };
        saveStorage();
        renderTabs();
        switchView(val);
        closeModal('add-year-modal');
        document.getElementById('new-year-input').value = '';
      } else {
        alert('請輸入有效的 4 位數年份（如：2028）且該年份尚未存在！');
      }
    }

    function deleteCurrentYear() {
      if (currentView === 'OVERVIEW' || currentView === 'TRIPLE' || currentView === 'GANTT') return;
      if (confirm(`確定要刪除整個 ${currentView} 年度及其所有目標資料嗎？`)) {
        delete db.years[currentView];
        saveStorage();
        const remaining = Object.keys(db.years).sort();
        if (remaining.length > 0) switchView(remaining[0]);
        else switchView('OVERVIEW');
      }
    }

    function openCatModal() {
      document.getElementById('new-cat-input').value = '';
      renderCatManageList();
      openModal('cat-modal');
    }

    function renderCatManageList() {
      const list = document.getElementById('cat-manage-list');
      list.innerHTML = '';
      db.categories.forEach((cat, idx) => {
        const item = document.createElement('div');
        item.className = 'cat-manage-item';
        item.innerHTML = `<span>${escapeHtml(cat)}</span><button class="action-icon-btn btn-del" onclick="deleteCategory(${idx})">✕</button>`;
        list.appendChild(item);
      });
    }

    function handleAddCategory(e) {
      e.preventDefault();
      const input = document.getElementById('new-cat-input');
      const val = input.value.trim();
      if (val && !db.categories.includes(val)) {
        db.categories.push(val);
        saveStorage();
        renderCategorySelects();
        renderCatManageList();
        input.value = '';
      }
    }

    function deleteCategory(index) {
      if (confirm('確定要刪除此分類嗎？')) {
        db.categories.splice(index, 1);
        saveStorage();
        renderCategorySelects();
        renderCatManageList();
      }
    }

    function openAddModal() {
      const yearSelect = document.getElementById('goal-year');
      yearSelect.innerHTML = '';
      Object.keys(db.years).sort().forEach(y => {
        yearSelect.innerHTML += `<option value="${y}" ${y === (currentView === 'GANTT' ? ganttTargetYear : currentView) ? 'selected' : ''}>${y} 年度</option>`;
      });

      // 清除文字輸入欄位，進度預設保持為 0
      document.getElementById('goal-title').value = '';
      document.getElementById('goal-progress-input').value = 0;
      document.getElementById('goal-notes').value = '';
      populateMonthSelects();

      openModal('add-modal');
    }

    function handleAddGoal(e) {
      e.preventDefault();
      const year = document.getElementById('goal-year').value;
      const category = document.getElementById('goal-category').value;
      const title = document.getElementById('goal-title').value.trim();
      const priority = document.getElementById('goal-priority').value;
      const startMonth = parseInt(document.getElementById('goal-start-month').value, 10) || 1;
      const endMonth = parseInt(document.getElementById('goal-end-month').value, 10) || 12;
      const progress = parseInt(document.getElementById('goal-progress-input').value, 10) || 0;
      const status = document.getElementById('goal-status').value;
      const notes = document.getElementById('goal-notes').value.trim();

      const newId = (db.years[year].items || []).length + 1;
      db.years[year].items.push({
        id: newId,
        category,
        priority,
        startMonth,
        endMonth,
        period: `${startMonth}月~${endMonth}月`,
        title,
        progress,
        status,
        notes: notes || "",
        logs: []
      });

      saveStorage();
      closeModal('add-modal');
      renderMainArea();

      // 重設表單
      document.getElementById('add-goal-form').reset();
      document.getElementById('goal-progress-input').value = 0;
      document.getElementById('goal-title').value = '';
      document.getElementById('goal-notes').value = '';
      populateMonthSelects();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function applyFilters() { renderMainArea(); }

    // 匯出 / 匯入 JSON
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `年度目標紀錄備份_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function triggerImportJSON() {
      document.getElementById('import-json-file').click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.years && imported.categories) {
            if (confirm("確認匯入備份檔案？現有資料將會被該檔案完全替換。")) {
              db = imported;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
              loadStorage();
              renderCategorySelects();
              renderTabs();
              renderMainArea();
              updateDashboard();
              renderCategoryBreakdown();
              alert("資料庫還原成功！");
            }
          } else {
            alert("檔案格式不符，請確認是此系統匯出的 JSON 檔案。");
          }
        } catch (err) {
          alert("解析 JSON 失敗：" + err.message);
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    // 系統生命週期初始化
    window.onload = function() {
      populateMonthSelects();
      loadStorage();
      renderCategorySelects();
      renderTabs();
      switchView('2026');
      updateDashboard();
      renderCategoryBreakdown();
    };
  </script>
</body>
</html>
